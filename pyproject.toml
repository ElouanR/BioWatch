[project]
name = "biowatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
biowatch = "biowatch:main"

[tool.ruff]
line-length = 79

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
